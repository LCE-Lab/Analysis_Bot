queue_rules:
  - name: dev-queue
    queue_conditions:
      - and:
          - base=dev
          - check-success=security-scan
          - check-success=scan-docker
          - check-success=docker-image
          - check-success=build-and-test
          - 'label!=status:blocked'
  - name: prod-queue
    queue_conditions:
      - and:
          - base=prod
          - check-success=security-scan
          - check-success=scan-docker
          - check-success=docker-image
          - check-success=build-and-test
          - 'label!=status:blocked'

pull_request_rules:
  - name: Automatic approval with label
    conditions:
      - base=dev
      - 'label!=status:blocked'
      - 'label=status:ready-to-merge'
      - '#approved-reviews-by=0'
      - check-success=security-scan
      - check-success=scan-docker
      - check-success=docker-image
      - check-success=build-and-test
    actions:
      review:
        type: APPROVE

  - name: Auto Merge renovate minor dep
    conditions:
      - base=dev
      - author=renovate[bot]
      - 'label!=status:blocked'
      - 'label=status:ready-to-merge'
      - '#commits-behind<5'
      - check-success=security-scan
      - check-success=scan-docker
      - check-success=docker-image
      - check-success=build-and-test
    actions:
      merge:

  - name: Merge branch into dev (Label)
    conditions:
      - base=dev
      - author!=renovate[bot]
      - 'label!=status:blocked'
      - 'label=status:ready-to-merge'
      - check-success=security-scan
      - check-success=scan-docker
      - check-success=docker-image
      - check-success=build-and-test
    actions:
      queue:
        name: dev-queue

  - name: Merge branch into dev (manual approval)
    conditions:
      - base=dev
      - author!=renovate[bot]
      - 'label!=status:blocked'
      - '#approved-reviews-by>=1'
      - check-success=security-scan
      - check-success=scan-docker
      - check-success=docker-image
      - check-success=build-and-test
    actions:
      queue:
        name: dev-queue

  - name: Merge Production
    conditions:
      - base=prod
      - 'label!=status:blocked'
      - '#approved-reviews-by>=1'
      - check-success=security-scan
      - check-success=scan-docker
      - check-success=docker-image
      - check-success=build-and-test
    actions:
      queue:
        name: prod-queue
merge_protections_settings:
  reporting_method: check-runs
